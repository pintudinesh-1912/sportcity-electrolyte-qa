[project]
name = "sportcity-electrolyte-qa"
version = "0.1.0"
description = "SportCity QA assessment: Electrolyte API test design, findings and automation"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3,<9",
    "requests>=2.32,<3",
    "jsonschema>=4.23,<5",
    "allure-pytest>=2.13,<3",
]

[dependency-groups]
report = ["markdown>=3.7,<4"]   # builds the Part 2 PDF (part2-findings/build_report.py)

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.per-file-ignores]
# Embeds Postman JavaScript test scripts as string literals; wrapping them hurts readability.
"part1-test-design/build_collection.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["support", "conftest"]
